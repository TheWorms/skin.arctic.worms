name: Sync addon metadata translations

on:
  push:
    branches: [ master, main ]
    paths:
      - '**addon.xml'
      - '**resource.language.**strings.po'

# Least privilege: the job only needs to push the amt-sync branch and open a PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  default:
    if: github.repository == 'beatmasterRS/skin.arctic.zephyr.mod'
    runs-on: ubuntu-latest

    steps:

      # Actions are pinned to a commit SHA so a moved tag cannot change what runs.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project

      - name: Checkout sync_addon_metadata_translations repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xbmc/sync_addon_metadata_translations
          path: sync_addon_metadata_translations
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sync_addon_metadata_translations/

      - name: Run sync-addon-metadata-translations
        run: |
          sync-addon-metadata-translations
        working-directory: ./project

      - name: Create PR for sync-addon-metadata-translations changes
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: Sync of addon metadata translations
          title: Sync of addon metadata translations
          body: Sync of addon metadata translations triggered by ${{ github.sha }}
          branch: amt-sync
          delete-branch: true
          path: ./project
